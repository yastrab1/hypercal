name: Deploy Hypercal

on:
  workflow_run:
    workflows: ['Build and test']
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: hypercal-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [hypercal-deploy-r2d2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Skip builds superseded on main
        id: current
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$EXPECTED_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8.0.2
        if: steps.current.outputs.deploy == 'true'
        with:
          name: hypercal-android
          path: ${{ runner.temp }}/hypercal-android-${{ github.run_id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Deploy successful build and verified Android update
        if: steps.current.outputs.deploy == 'true'
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          ANDROID_ARTIFACT_DIR: ${{ runner.temp }}/hypercal-android-${{ github.run_id }}
        run: scripts/deploy/r2d2.sh
