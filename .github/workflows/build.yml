name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HYPERCAL_ANDROID_URL: ${{ vars.HYPERCAL_ANDROID_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build web and sync Android
        run: npm run android:sync
      - name: Restore consistent debug signing identity
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - name: Package APK and checksum
        run: npm run android:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hypercal-android
          path: |
            dist/downloads/hypercal-debug.apk
            dist/downloads/hypercal-debug.apk.sha256
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hypercal-web
          path: dist/
          retention-days: 14
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: hypercal-android
          path: release/
      - name: Publish Android download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "HyperCal $tag" --generate-notes
          else
            tag=continuous
            if gh release view "$tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title 'Latest main build' --prerelease --notes 'Automatically rebuilt from main. Debug APK; backend configuration is described in the README.'
            fi
          fi
          gh release upload "$tag" release/hypercal-debug.apk release/hypercal-debug.apk.sha256 --clobber
