# Copy this file into R2D2's unified directory and include it in docker-compose.yml.
# Keep .env and .data in the existing HyperCal checkout; neither enters the image.
services:
  hypercal:
    build:
      context: ${HYPERCAL_ROOT:-../hypercal}
      dockerfile: Dockerfile
    image: hypercal:local
    pull_policy: never
    restart: unless-stopped
    init: true
    user: ${HYPERCAL_UID:-1000}:${HYPERCAL_GID:-1000}
    env_file:
      - ${HYPERCAL_ROOT:-../hypercal}/.env
      - path: ${HYPERCAL_ROOT:-../hypercal}/.env.edupage
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATA_DIR: /data
      BROWSER_WORKER_URL: http://hypercal-browser:3002
      TRUST_PROXY: 1
      COOKIE_SECURE: "true"
    ports:
      - 127.0.0.1:3791:3001
    volumes:
      - ${HYPERCAL_ROOT:-../hypercal}/.data:/data
      - ${HYPERCAL_ROOT:-../hypercal}/dist/downloads:/app/dist/downloads:ro
    networks: [hypercal]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s


  hypercal-browser:
    depends_on:
      hypercal:
        condition: service_healthy
    build:
      context: ${HYPERCAL_ROOT:-../hypercal}
      dockerfile: worker/Dockerfile
    image: hypercal-browser:local
    pull_policy: never
    restart: unless-stopped
    init: true
    user: ${HYPERCAL_UID:-1000}:${HYPERCAL_GID:-1000}
    env_file:
      - path: ${HYPERCAL_ROOT:-../hypercal}/.env.edupage
        required: false
    volumes:
      - ${HYPERCAL_ROOT:-../hypercal}/.data/plugin-browser:/profiles
      - ${HYPERCAL_ROOT:-../hypercal}/.data/browser-worker-token:/run/secrets/browser-token:ro
    networks: [hypercal]
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
    shm_size: 256mb
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./browser-seccomp.json
    mem_limit: 2g
    stop_grace_period: 30s

networks:
  hypercal:
